# Builds the sdist and the (pure Python) wheel, publishes them to PyPI, then
# creates the GitHub release with the same files and the version's notes from
# CHANGELOG.md (scripts/release_notes.py).
#
# Triggered by pushing a v* tag. `workflow_dispatch` runs the same build but
# skips publishing, so the build can be rehearsed without burning a version
# number: PyPI releases are immutable, so a broken release can only be yanked.
#
# Publishing uses PyPI Trusted Publishing (OIDC): there is no API token to
# store, but the `pypi` environment must be registered as a trusted publisher
# for this repository and workflow.
# https://docs.pypi.org/trusted-publishers/
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the package version $version" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: The wheel installs and profiles without pandas
        run: |
          uv venv /tmp/clean --python 3.12
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/python -c "
          import importlib.util, polars as pl
          from polars_data_profiling import ProfileReport
          assert importlib.util.find_spec('pandas') is None
          ProfileReport(pl.DataFrame({'a': [1, 2, 3]}), progress_bar=False).to_html()
          print('ok')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    # Only a pushed tag publishes; workflow_dispatch stops after the build.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/polars-data-profiling
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [publish]
    # After PyPI accepted the files, so the release never advertises a version
    # that failed to publish.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      # Creates the release, or updates it when the job is re-run.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
          fi
