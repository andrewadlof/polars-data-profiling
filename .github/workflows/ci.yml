# Per-PR gate: lint, check that pandas never enters the dependency tree, run the
# tests, and prove the wheel builds, installs into a clean environment and
# profiles a frame without importing pandas.
#
# Pull requests into `development` run the fast checks and the tests on one
# platform. Pull requests into `main` (and manual runs) run the tests on Linux,
# macOS and Windows for every supported Python, and build the wheel.
name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint and dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Ruff
        run: |
          uv run --only-group dev ruff check
          uv run --only-group dev ruff format --check
      - name: No pandas in the dependency tree
        run: uv run --only-group dev just no-pandas

  test-quick:
    name: Tests (ubuntu, 3.12)
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-extras
      - name: Tests
        run: uv run pytest -ra

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Sync
        run: uv sync --all-extras
      - name: Tests
        run: uv run pytest -ra

  package:
    name: Build and smoke-test the wheel
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/clean --python 3.12
          uv pip install --python /tmp/clean/bin/python dist/*.whl
      - name: The wheel profiles a LazyFrame without pandas
        run: |
          /tmp/clean/bin/python - <<'PY'
          import importlib.util, sys
          import polars as pl
          from polars_data_profiling import ProfileReport

          assert importlib.util.find_spec("pandas") is None, "pandas was installed"
          lf = pl.LazyFrame({"a": list(range(100)), "b": ["x", "y"] * 50})
          html = lf.profile.report(progress_bar=False).to_html()
          assert "<svg" in html
          assert not any(m.split(".")[0] == "pandas" for m in sys.modules)
          print("ok")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
