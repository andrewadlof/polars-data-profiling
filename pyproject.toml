# =============================================================================
#
# Polars-native data profiling: a fork of fg-data-profiling (formerly
# ydata-profiling / pandas-profiling) with the pandas and Spark backends replaced
# by a single Polars engine built on LazyFrames. Profiles run as a handful of
# batched lazy queries, so a `scan_parquet` / `scan_csv` input is read a few
# times in total instead of once per column. pandas is not a dependency, direct
# or transitive.
# =============================================================================
[project]
name = "polars-data-profiling"
version = "0.1.0"
description = "Polars-native, lazy data profiling reports (a pandas-free fork of ydata-profiling)."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["data-profiling", "data-quality", "eda", "lazyframe", "polars", "profiling", "report"]
authors = [{ name = "Drew Adlof", email = "drew.adlof@gmail.com" }]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: IPython",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "filetype>=1.0.0",
  "jinja2>=3.1.6,<3.2",
  "minify-html>=0.15.0",
  "numpy>=1.24",
  "polars>=2.0",
  "pydantic-settings>=2.6",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0",
  # chi-squared p-values, Kendall's tau, contingency tests, FFT peak finding
  "scipy>=1.10",
  "tqdm>=4.66.3,<5",
]

[project.optional-dependencies]
# Image variables: dimensions, EXIF and perceptual hashes (`vars.image.active`)
image = ["imagehash>=4.3", "pillow>=10"]
# Jupyter widgets flavour (`report.to_widgets()`)
notebook = ["ipywidgets>=8"]
# Word clouds for text variables (a word-frequency chart is drawn without it)
wordcloud = ["wordcloud>=1.9.4"]
# Everything above
all = ["imagehash>=4.3", "ipywidgets>=8", "pillow>=10", "wordcloud>=1.9.4"]

[project.urls]
Homepage = "https://github.com/andrewadlof/polars-data-profiling"
Repository = "https://github.com/andrewadlof/polars-data-profiling"
Documentation = "https://andrewadlof.github.io/polars-data-profiling/"
Issues = "https://github.com/andrewadlof/polars-data-profiling/issues"
Changelog = "https://github.com/andrewadlof/polars-data-profiling/blob/main/CHANGELOG.md"

[project.scripts]
polars_data_profiling = "polars_data_profiling.controller.console:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "polars_data_profiling"

[dependency-groups]
dev = [
  "mdformat-gfm>=0.4.1",
  "mdformat>=0.7.22",
  "pillow>=10",
  "prek>=0.2.3",
  "pyarrow>=14",
  "pytest-cov>=6.2.1",
  "pytest>=8.4.2",
  "ruff>=0.12.12",
  "rust-just>=1.50.0",
]
docs = [
  "mkdocs-api-autonav",
  "mkdocs-github-admonitions-plugin",
  "mkdocs-glightbox",
  "mkdocstrings[python]",
  "zensical>=0.0.20",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: long strings in templates and messages; B905: zip(strict=) is noise here
ignore = ["E501", "B905", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
